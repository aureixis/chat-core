x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://chat:chat@postgres:5432/chat
  ENVIRONMENT: development
  JWT_SECRET: local-development-secret-change-before-production
  ADMIN_EMAIL: admin@example.com
  ADMIN_PASSWORD: local-admin-password
  CORS_ORIGINS: http://localhost:5173
  AUTO_CREATE_SCHEMA: "false"

x-runtime-security: &runtime-security
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  init: true
  pids_limit: 200

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data

  migrate:
    <<: *runtime-security
    build: .
    environment: *app-environment
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  api:
    <<: *runtime-security
    build: .
    environment:
      <<: *app-environment
      AGENT_WORKER_ENABLED: "false"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - data
      - api_egress
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  worker:
    <<: *runtime-security
    build: .
    environment:
      <<: *app-environment
      AGENT_WORKER_ENABLED: "false"
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      disable: true
    networks:
      - data
      - worker_egress
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

volumes:
  postgres_data:

networks:
  data:
    internal: true
  api_egress:
  worker_egress:
